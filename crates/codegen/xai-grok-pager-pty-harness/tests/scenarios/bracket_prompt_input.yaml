name: bracket-prompt-input
description: >
  Regression — typing a lone `[` in the prompt must render immediately
  (CsiFragmentFilter must not hold it until the next keystroke).
terminal:
  rows: 32
  cols: 100
mock:
  response: "unused"
steps:
  - action: wait_for_text
    text: Quit
    timeout_ms: 20000
  - action: focus_prompt
  - action: type_text
    text: "["
  - action: wait
    millis: 100
  - action: assert_contains
    text: "["
  # The first keystroke on the welcome screen starts a session, and the
  # welcome -> agent transition swallows keystrokes typed while it runs. Wait
  # for the agent screen's composer hint (and let the transition settle)
  # before typing the rest, otherwise "link]" is typed mid-transition and
  # dropped.
  - action: wait_for_text
    text: "Enter:send"
    timeout_ms: 15000
  - action: wait
    millis: 500
  - action: type_text
    text: "link]"
  - action: assert_contains
    text: "[link]"
  - action: screenshot
    name: bracket-prompt
    note: Prompt shows typed brackets without waiting for a follow-up key.
