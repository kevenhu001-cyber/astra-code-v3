name: test

# Linux-only test suite. PR + main + manual. Heavy / slow / flaky tiers
# (full workspace PTY, leader PTY, scripted scenarios) live in nightly.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # protoc is installed directly per job ("Install protoc" step) instead of
  # relying on the dotslash `bin/protoc` manifest, whose build-time download
  # has no retry-able mirror fallback.
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Fast unit tests. The PR feedback path. Skips ignored PTY / leader /
  # scripted scenarios so this stays under ~10 min on a cold cache.
  unit:
    name: cargo test --workspace (lib + bins)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git

      # Deterministic protoc provisioning. `bin/protoc` is a dotslash manifest
      # that downloads the binary at build time with no mirror fallback — a
      # transient runner DNS failure then kills the whole job. Setting $PROTOC
      # bypasses dotslash entirely (see the lookup order in
      # crates/build/xai-proto-build/src/find_protoc.rs).
      # Version pinned to v29.3, matching the bin/protoc manifest.
      - name: Install protoc (pinned v29.3)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset="protoc-29.3-osx-aarch_64.zip" ;;
            Darwin-x86_64) asset="protoc-29.3-osx-x86_64.zip" ;;
            Linux-x86_64)  asset="protoc-29.3-linux-x86_64.zip" ;;
            Linux-aarch64) asset="protoc-29.3-linux-aarch_64.zip" ;;
            *) echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/protoc-29.3"
          mkdir -p "$dest"
          for url in \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}" \
            "https://gh-proxy.com/https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}"
          do
            if curl --fail --location --retry 3 --retry-delay 3 --retry-all-errors \
                 --silent --show-error -o "$dest/protoc.zip" "$url"; then
              break
            fi
            echo "Download failed from $url; trying next mirror" >&2
            rm -f "$dest/protoc.zip"
          done
          test -s "$dest/protoc.zip" \
            || { echo "protoc download failed from all mirrors" >&2; exit 1; }
          unzip -oq "$dest/protoc.zip" -d "$dest"
          echo "PROTOC=$dest/bin/protoc" >> "$GITHUB_ENV"
          "$dest/bin/protoc" --version

      # The search-tool suites spawn `rg` from PATH; debug builds don't bundle it.
      - name: Install ripgrep (search-tool tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: cargo test (workspace, lib + bins)
        env:
          # Debug builds of the shell's giant turn-loop futures consume
          # hundreds of KB per poll frame; the default 8 MiB test-thread
          # stack overflows in the auth-retry-budget scenarios.
          RUST_MIN_STACK: 67108864
        run: |
          set -euo pipefail
          # `--workspace --lib --bins` covers every crate's in-crate tests;
          # `--tests` would also compile ignored PTY / leader / scripted
          # targets — those are exercised by `regressions` / `pty-e2e` /
          # `leader-pty-e2e` jobs (and the full sweep lives in nightly.yml).
          cargo test --workspace --lib --bins --locked --no-fail-fast -- --quiet

  # ── Regression / consistency tests that aren't part of `cargo test` because
  # they're either integration tests inside the pager crate, or live in
  # crates without much unit-test surface.
  regressions:
    name: regression suite (brand sweep, marketing, docs, …)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git

      # Deterministic protoc provisioning. `bin/protoc` is a dotslash manifest
      # that downloads the binary at build time with no mirror fallback — a
      # transient runner DNS failure then kills the whole job. Setting $PROTOC
      # bypasses dotslash entirely (see the lookup order in
      # crates/build/xai-proto-build/src/find_protoc.rs).
      # Version pinned to v29.3, matching the bin/protoc manifest.
      - name: Install protoc (pinned v29.3)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset="protoc-29.3-osx-aarch_64.zip" ;;
            Darwin-x86_64) asset="protoc-29.3-osx-x86_64.zip" ;;
            Linux-x86_64)  asset="protoc-29.3-linux-x86_64.zip" ;;
            Linux-aarch64) asset="protoc-29.3-linux-aarch_64.zip" ;;
            *) echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/protoc-29.3"
          mkdir -p "$dest"
          for url in \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}" \
            "https://gh-proxy.com/https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}"
          do
            if curl --fail --location --retry 3 --retry-delay 3 --retry-all-errors \
                 --silent --show-error -o "$dest/protoc.zip" "$url"; then
              break
            fi
            echo "Download failed from $url; trying next mirror" >&2
            rm -f "$dest/protoc.zip"
          done
          test -s "$dest/protoc.zip" \
            || { echo "protoc download failed from all mirrors" >&2; exit 1; }
          unzip -oq "$dest/protoc.zip" -d "$dest"
          echo "PROTOC=$dest/bin/protoc" >> "$GITHUB_ENV"
          "$dest/bin/protoc" --version

      - name: Build pager once (binary + helpers for scenario runner)
        run: cargo build -p xai-grok-pager-bin --bin astra

      - name: Point the harness at the built binary
        run: echo "PAGER_BINARY=${{ github.workspace }}/target/debug/astra" >> "$GITHUB_ENV"

      - name: Brand sweep (no leaked legacy xai refs in user-guide)
        run: cargo test -p xai-grok-pager --test brand_sweep_no_legacy_xai_refs

      - name: Marketing site (no Go lang leftovers)
        run: cargo test -p xai-grok-pager --test marketing_site_no_go_lang

      - name: Registered features are documented
        run: cargo test -p xai-grok-pager --test registered_features_are_documented

      - name: Doctor early dispatch
        run: cargo test -p xai-grok-pager-pty-harness --test doctor_early_dispatch

      - name: Grok home paths
        run: cargo test -p xai-grok-pager --test grok_home_paths

      - name: Selection model public API surface
        run: cargo test -p xai-grok-pager --test selection_model_public_api

      - name: Signal errno preservation
        run: cargo test -p xai-grok-pager --test signal_errno_preservation

      - name: Settings E2E (lightweight)
        run: cargo test -p xai-grok-pager --test settings_e2e

      - name: Scripted scenarios — selected happy-path
        run: |
          # Sample scenarios chosen for fast / low-flake feedback. The full
          # 45+ scenarios run nightly.
          # `--test-threads=1` matches nightly.yml: each scenario spawns its own
          # mock inference server and a real pager, so running them in parallel
          # starves the session-start path and drops keystrokes typed during it
          # (the `bracket-prompt-input` scenario lost its tail that way).
          cargo test -p xai-grok-pager-pty-harness --test scripted_scenarios -- --ignored \
            scripted_welcome_screen \
            scripted_mock_response \
            scripted_bracket_prompt_input \
            scripted_image_inputs \
            --test-threads=1

      - name: Upload scripted scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-scenario-artifacts
          path: /tmp/scripted-scenarios/**
          if-no-files-found: ignore
          retention-days: 7

  # ── Auth server tests. Already live in build.yml today, but they belong
  # with the test workflow rather than the build matrix.
  auth-server:
    name: cargo test -p astra-auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git

      - name: cargo test -p astra-auth
        run: cargo test -p astra-auth --locked

  # ── PTY integration smoke. Runs the entire family (`--ignored`) but caps
  # libtest workers so it stays under the timeout; flaky cases are rerun by
  # the harness or moved to nightly.yml.
  pty-e2e:
    name: pty_e2e (smoke, ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git

      # Deterministic protoc provisioning. `bin/protoc` is a dotslash manifest
      # that downloads the binary at build time with no mirror fallback — a
      # transient runner DNS failure then kills the whole job. Setting $PROTOC
      # bypasses dotslash entirely (see the lookup order in
      # crates/build/xai-proto-build/src/find_protoc.rs).
      # Version pinned to v29.3, matching the bin/protoc manifest.
      - name: Install protoc (pinned v29.3)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset="protoc-29.3-osx-aarch_64.zip" ;;
            Darwin-x86_64) asset="protoc-29.3-osx-x86_64.zip" ;;
            Linux-x86_64)  asset="protoc-29.3-linux-x86_64.zip" ;;
            Linux-aarch64) asset="protoc-29.3-linux-aarch_64.zip" ;;
            *) echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/protoc-29.3"
          mkdir -p "$dest"
          for url in \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}" \
            "https://gh-proxy.com/https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}"
          do
            if curl --fail --location --retry 3 --retry-delay 3 --retry-all-errors \
                 --silent --show-error -o "$dest/protoc.zip" "$url"; then
              break
            fi
            echo "Download failed from $url; trying next mirror" >&2
            rm -f "$dest/protoc.zip"
          done
          test -s "$dest/protoc.zip" \
            || { echo "protoc download failed from all mirrors" >&2; exit 1; }
          unzip -oq "$dest/protoc.zip" -d "$dest"
          echo "PROTOC=$dest/bin/protoc" >> "$GITHUB_ENV"
          "$dest/bin/protoc" --version

      - name: Build pager binary for the harness
        run: cargo build -p xai-grok-pager-bin --bin astra

      - name: Point the harness at the built binary
        run: echo "PAGER_BINARY=${{ github.workspace }}/target/debug/astra" >> "$GITHUB_ENV"

      - name: pty_e2e (smoke subset, serialized)
        # The pty_e2e/* headers self-disable for ordinary cargo runs (all cases
        # are `#[ignore]`d); the `--ignored` flag opts them back in. Workers
        # are capped to avoid the 60→240s flake history called out in
        # `tests/leader_pty_e2e/mod.rs`.
        run: |
          cargo test -p xai-grok-pager-pty-harness --test pty_e2e_smoke \
            -- --ignored --test-threads=2 --nocapture

  # ── Leader PTY E2E. Multi-process (boots 2-3 pager instances + a leader
  # subprocess). Run serialized on a dedicated job so it can't race with the
  # main pty_e2e pool.
  leader-pty-e2e:
    name: leader_pty_e2e (serialized, ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git

      # Deterministic protoc provisioning. `bin/protoc` is a dotslash manifest
      # that downloads the binary at build time with no mirror fallback — a
      # transient runner DNS failure then kills the whole job. Setting $PROTOC
      # bypasses dotslash entirely (see the lookup order in
      # crates/build/xai-proto-build/src/find_protoc.rs).
      # Version pinned to v29.3, matching the bin/protoc manifest.
      - name: Install protoc (pinned v29.3)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset="protoc-29.3-osx-aarch_64.zip" ;;
            Darwin-x86_64) asset="protoc-29.3-osx-x86_64.zip" ;;
            Linux-x86_64)  asset="protoc-29.3-linux-x86_64.zip" ;;
            Linux-aarch64) asset="protoc-29.3-linux-aarch_64.zip" ;;
            *) echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/protoc-29.3"
          mkdir -p "$dest"
          for url in \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}" \
            "https://gh-proxy.com/https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}"
          do
            if curl --fail --location --retry 3 --retry-delay 3 --retry-all-errors \
                 --silent --show-error -o "$dest/protoc.zip" "$url"; then
              break
            fi
            echo "Download failed from $url; trying next mirror" >&2
            rm -f "$dest/protoc.zip"
          done
          test -s "$dest/protoc.zip" \
            || { echo "protoc download failed from all mirrors" >&2; exit 1; }
          unzip -oq "$dest/protoc.zip" -d "$dest"
          echo "PROTOC=$dest/bin/protoc" >> "$GITHUB_ENV"
          "$dest/bin/protoc" --version

      - name: Build pager binary for the leader harness
        run: cargo build -p xai-grok-pager-bin --bin astra

      - name: Point the harness at the built binary
        run: echo "PAGER_BINARY=${{ github.workspace }}/target/debug/astra" >> "$GITHUB_ENV"

      - name: leader_pty_e2e (single-threaded)
        run: |
          cargo test -p xai-grok-pager-pty-harness --test leader_pty_e2e \
            -- --ignored --test-threads=1 --nocapture
