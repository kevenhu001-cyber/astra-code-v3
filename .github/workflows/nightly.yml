            rm -f "$dest/protoc.zip"
          done
          test -s "$dest/protoc.zip" \
            || { echo "protoc download failed from all mirrors" >&2; exit 1; }
          unzip -oq "$dest/protoc.zip" -d "$dest"
          echo "PROTOC=$dest/bin/protoc" >> "$GITHUB_ENV"
          "$dest/bin/protoc" --version

      - name: Build pager binary for the harness
        run: cargo build -p xai-grok-pager-bin --bin astra

      - name: Point the harness at the built binary
        run: echo "PAGER_BINARY=${{ github.workspace }}/target/debug/astra" >> "$GITHUB_ENV"

      - name: Run every scripted scenario
        # test-threads=1 because each scenario spins up its own mock
        # inference server; running them in parallel has been the source of
        # port-bind flake in past CI history.
        run: |
          cargo test -p xai-grok-pager-pty-harness --locked --test scripted_scenarios \
            -- --ignored --test-threads=1

  leader-pty-e2e-full:
    name: leader_pty_e2e (full, single-threaded)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
