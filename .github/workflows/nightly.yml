  bench:
    name: cargo bench (compile + smoke)
    runs-on: ubuntu-latest
    # `cargo bench --workspace --no-run` compiles every bench target in the
    # workspace from a cold cache (the rust-cache action only keeps the cargo
    # registry/git, not `target/`), which alone exceeded the old 60 min budget.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git

      # Deterministic protoc provisioning. `bin/protoc` is a dotslash manifest
      # that downloads the binary at build time with no mirror fallback — a
      # transient runner DNS failure then kills the whole job. Setting $PROTOC
