name: nightly

# Heavy / slow / flaky tier. Runs once a day at 04:00 UTC.
# Captures regressions that are too expensive for the PR loop:
#   - full workspace test (every ignored case included)
#   - serialized leader PTY suite
#   - every scripted_scenarios YAML
#   - benchmark smoke (bench --no-run plus one or two representative benches)
#   - upstream merge probe (conflict canary for `xai-org/grok-build`)

on:
  schedule:
    # Daily at 04:00 UTC. Stagger from audit.yml (Mon 06:00) so they don't
    # both hammer the cache cold at the same instant.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  full-test:
    name: cargo test --workspace --all-targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git

      # Deterministic protoc provisioning. `bin/protoc` is a dotslash manifest
      # that downloads the binary at build time with no mirror fallback — a
      # transient runner DNS failure then kills the whole job. Setting $PROTOC
      # bypasses dotslash entirely (see the lookup order in
      # crates/build/xai-proto-build/src/find_protoc.rs).
      # Version pinned to v29.3, matching the bin/protoc manifest.
      - name: Install protoc (pinned v29.3)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset="protoc-29.3-osx-aarch_64.zip" ;;
            Darwin-x86_64) asset="protoc-29.3-osx-x86_64.zip" ;;
            Linux-x86_64)  asset="protoc-29.3-linux-x86_64.zip" ;;
            Linux-aarch64) asset="protoc-29.3-linux-aarch_64.zip" ;;
            *) echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/protoc-29.3"
          mkdir -p "$dest"
          for url in \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}" \
            "https://gh-proxy.com/https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}"
          do
            if curl --fail --location --retry 3 --retry-delay 3 --retry-all-errors \
                 --silent --show-error -o "$dest/protoc.zip" "$url"; then
              break
            fi
            echo "Download failed from $url; trying next mirror" >&2
            rm -f "$dest/protoc.zip"
          done
          test -s "$dest/protoc.zip" \
            || { echo "protoc download failed from all mirrors" >&2; exit 1; }
          unzip -oq "$dest/protoc.zip" -d "$dest"
          echo "PROTOC=$dest/bin/protoc" >> "$GITHUB_ENV"
          "$dest/bin/protoc" --version

      # The search-tool suites spawn `rg` from PATH; debug builds don't bundle it.
      - name: Install ripgrep (search-tool tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: cargo test (workspace, all-targets, including ignored)
        env:
          # Match test.yml: large debug futures overflow the default stack.
          RUST_MIN_STACK: 67108864
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --locked --no-fail-fast -- --include-ignored

  scripted-scenarios-full:
    name: scripted_scenarios (full sweep, ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git

      # Deterministic protoc provisioning. `bin/protoc` is a dotslash manifest
      # that downloads the binary at build time with no mirror fallback — a
      # transient runner DNS failure then kills the whole job. Setting $PROTOC
      # bypasses dotslash entirely (see the lookup order in
      # crates/build/xai-proto-build/src/find_protoc.rs).
      # Version pinned to v29.3, matching the bin/protoc manifest.
      - name: Install protoc (pinned v29.3)
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
