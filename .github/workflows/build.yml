name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The repo's `bin/protoc` is a dotslash manifest (macOS/Linux only); on
  # Linux runners dotslash fetches the pinned protoc release automatically.
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dotslash (protoc provider)
        run: |
          cargo install dotslash --locked
          /usr/bin/env dotslash --help

      - name: Cargo check (fast validation)
        run: cargo check -p xai-grok-pager-bin

      - name: Build release binary
        run: cargo build -p xai-grok-pager-bin --release

      - name: Cargo test (sampling-types + agent prompt)
        run: |
          cargo test -p xai-grok-sampling-types --lib
          cargo test -p xai-grok-agent --lib prompt::template

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: astra-code-linux-x86_64
          path: target/release/xai-grok-pager
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: astra-code-linux-x86_64
          path: dist

      - name: Package tarball + checksum
        working-directory: dist
        run: |
          chmod +x xai-grok-pager
          mv xai-grok-pager astra-code
          tar -czf "astra-code-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" astra-code
          sha256sum "astra-code-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            > "astra-code-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
