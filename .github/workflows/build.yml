name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The repo's `bin/protoc` is a dotslash manifest; on every GitHub-hosted
  # runner (Linux/macOS/Windows) dotslash fetches the pinned protoc release
  # automatically.
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: astra
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: astra
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: astra
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: astra
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: astra.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install dotslash (protoc provider)
        run: |
          cargo install dotslash --locked
          dotslash --help

      # On Windows the dotslash `bin/protoc` manifest cannot be executed
      # directly (no shebang support), so provide the pinned protoc binary via
      # $PROTOC instead. Same version (v29.3) as the dotslash manifest.
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: |
          $protocDir = "$env:TEMP\protoc-29.3"
          $zip = "$env:TEMP\protoc-29.3.zip"
          curl.exe -sSL -o $zip "https://gh-proxy.com/https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip"
          Expand-Archive -Path $zip -DestinationPath $protocDir -Force
          "PROTOC=$protocDir\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Cargo check (fast validation)
        run: cargo check -p xai-grok-pager-bin --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p xai-grok-pager-bin --release --target ${{ matrix.target }}

      - name: Compute release tag
        id: version
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            BASE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1)"
            if [ -z "$BASE_VERSION" ]; then
              BASE_VERSION="0.0.0"
            fi
            echo "RELEASE_TAG=v${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Cargo test (sampling-types + agent prompt)
        # Tests are host-platform (wire types are platform-agnostic), so run
        # them once on Linux only — duplicating across the matrix is waste.
        # (astra-auth's own tests run in the `astra-auth` job below.)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p xai-grok-sampling-types --lib
          cargo test -p xai-grok-agent --lib prompt::template

      - name: Package archive + checksum
        working-directory: target/${{ matrix.target }}/release
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${RELEASE_TAG:-${GITHUB_REF_NAME:-dev}}"
          ARTIFACT="astra-${REF_NAME}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            # The matrix binary is already named `astra`; only rename when
            # it differs (cp refuses source == destination).
            if [ "${{ matrix.binary }}" != "astra" ]; then
              cp "${{ matrix.binary }}" astra
            fi
            tar -czf "${ARTIFACT}.tar.gz" astra
            sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          else
            mkdir astra
            if [ "${{ matrix.binary }}" != "astra.exe" ]; then
              cp "${{ matrix.binary }}" astra/
            else
              cp astra.exe astra/
            fi
            # Windows runners' Git bash has no `zip`; use PowerShell instead.
            pwsh -NoProfile -Command "Compress-Archive -Path astra -DestinationPath '${ARTIFACT}.zip' -Force"
            sha256sum "${ARTIFACT}.zip" > "${ARTIFACT}.zip.sha256"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: astra-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/astra-*.tar.gz
            target/${{ matrix.target }}/release/astra-*.zip
            target/${{ matrix.target }}/release/astra-*.sha256
          if-no-files-found: error

  # astra-auth: the official site + account/auth API server (Rust port of the
  # Go astra-auth). Deployed on the site's Linux host, so we only build the
  # Linux targets — the CLI matrix above covers the desktop platforms.
  astra-auth:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: astra-auth
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: astra-auth
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cargo check (fast validation)
        run: cargo check -p astra-auth --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p astra-auth --release --target ${{ matrix.target }}

      - name: Compute release tag
        id: version
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            BASE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1)"
            if [ -z "$BASE_VERSION" ]; then
              BASE_VERSION="0.0.0"
            fi
            echo "RELEASE_TAG=v${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Cargo test (auth server)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p astra-auth

      - name: Package archive + checksum
        working-directory: target/${{ matrix.target }}/release
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${RELEASE_TAG:-${GITHUB_REF_NAME:-dev}}"
          ARTIFACT="astra-auth-${REF_NAME}-${{ matrix.target }}"
          # The matrix binary is already named `astra-auth`; only rename when
          # it differs (cp refuses source == destination).
          if [ "${{ matrix.binary }}" != "astra-auth" ]; then
            cp "${{ matrix.binary }}" astra-auth
          fi
          tar -czf "${ARTIFACT}.tar.gz" astra-auth
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: astra-auth-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/astra-auth-*.tar.gz
            target/${{ matrix.target }}/release/astra-auth-*.sha256
          if-no-files-found: error

  release:
    needs: [build, astra-auth]
    runs-on: ubuntu-latest
    # Auto-publish a new release after every successful CI run on main, and
    # keep the manual tag-push flow (`v*`) working unchanged.
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success' && needs.astra-auth.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Compute release tag
        id: version
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            BASE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/codegen/xai-grok-pager-bin/Cargo.toml | head -1)"
            if [ -z "$BASE_VERSION" ]; then
              BASE_VERSION="0.0.0"
            fi
            echo "tag=v${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.sha256
