# Cargo audit allowlist for known advisories that are not yet fixed upstream
# or are false positives for this workspace. Entries were observed in CI run
# 32574860043 (2026-08-22) and re-checked in run 41687400695 (2026-11-03)
# with `cargo audit --deny warnings`.
# Remove entries as dependencies are updated.

[advisories]
ignore = [
    # quick-xml: quadratic run time / unbounded namespace allocation (RUSTSEC-2026-0194, RUSTSEC-2026-0195)
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rsa: Marvin Attack timing sidechannel (RUSTSEC-2023-0071)
    "RUSTSEC-2023-0071",
    # async-std unmaintained (RUSTSEC-2025-0052)
    "RUSTSEC-2025-0052",
    # backoff unmaintained (RUSTSEC-2025-0057)
    "RUSTSEC-2025-0057",
    # bincode unmaintained (RUSTSEC-2024-0384)
    "RUSTSEC-2024-0384",
    # fxhash, instant, paste, rustybuzz, smartstring, ttf-parser, yaml-rust - batch unmaintained/yanked
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0320",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0012",
    "RUSTSEC-2026-0183",
    "RUSTSEC-2026-0184",
    # event-listener, git2, lru, rand, scc etc
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0205",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0221",
    "RUSTSEC-2026-0249",
    "RUSTSEC-2026-0253",
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0008",
    "RUSTSEC-2026-0097",
    # crypto-bigint: timing variability in constant-time ops (RUSTSEC-2026-0387).
    # The fix is crypto-bigint >= 0.7.6, which needs elliptic-curve >= 0.14,
    # which needs p256/p384 >= 0.14. Every published jsonwebtoken release
    # (through 11.1.0) still pins p256 ^0.13.2 / p384 ^0.13.0, so the upgrade
    # is blocked upstream. Only reached through jsonwebtoken's ECDSA JWT
    # signature *verification* (astra-auth, xai-grok-login), where the
    # attacker-supplied side is the signature rather than the secret scalar.
    "RUSTSEC-2026-0387",
    # unsafe-libyaml unmaintained (RUSTSEC-2024-0449). Pulled by serde_yaml
    # 0.9.34+deprecated, which is the crate's final release - serde_yaml is
    # deprecated with no successor version and no drop of unsafe-libyaml.
    # Our serde_yaml use is config/scenario parsing, never untrusted YAML.
    "RUSTSEC-2024-0449",
    # zbus / zvariant / zbus_names unmaintained (RUSTSEC-2026-0370,
    # RUSTSEC-2026-0371, RUSTSEC-2026-0372). The zbus 5 line is the current
    # release and every version in it depends on the unmaintained zvariant
    # stack; ashpd (our only route in) pins zbus ^5.13. Freedesktop portal
    # calls only, on the local session bus.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # pin-utils 0.1.0 is unmaintained (RUSTSEC-2026-0441); still pulled in
    # transitively by async-std, hyper and AWS Smithy crates. This is a
    # maintenance advisory, not a published vulnerability. Revisit when
    # those upstream crates stop depending on pin-utils.
    "RUSTSEC-2026-0441",
]

# Yanked crates (aes 0.9.0, spin 0.9.8/0.10.0) are pulled via transitive deps
# and have no direct upgrade path without a major dependency bump. Disable
# yanked deny for now; the crate warnings are not security-critical for CI.
[yanked]
enabled = false